<header>
  <h1>Todo App</h1>
</header>

<section class="welcome">
  <h2>Welcome!</h2>
  <p>To get started, add some items to your list:</p>
  <div class="add-todo">
    <input type="text" placeholder="i want to do ..." [(ngModel)]="newTodo" />
    <button (click)="addTodo()">add</button>
  </div>
</section>

<div class="tabs">
  <span class="badge">Undone {{undoneCount}}</span>
  <span class="badge done">Done {{doneCount}}</span>
</div>

<div class="todo-list">
  <!-- todos  -->
  @for (todo of todos; track todo.id) {
    <todo-item 
      [todo]="todo" 
      (toggle)="toggleTodo($event)" 
      (delete)="deleteTodo($event)"
      (edit)="editTodo($event)"
      >
    </todo-item>
  }
</div>
